  }
});

    <div class="post-body" itemprop="articleBody"><h2 id="使用方法"><a href="#使用方法" class="headerlink" title="使用方法"></a>使用方法</h2><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br></pre></td><td class="code"><pre><span class="line">awk <span class="string">&#x27;&#123;pattern + action&#125;&#x27;</span> &#123;filenames&#125;</span><br><span class="line"></span><br><span class="line">变量名	含义 </span><br><span class="line">ARGC	命令行变元个数 </span><br><span class="line">ARGV	命令行变元数组 </span><br><span class="line">FILENAME	当前输入文件名 </span><br><span class="line">FNR	当前文件中的记录号 </span><br><span class="line">FS	输入域分隔符，默认为一个空格 </span><br><span class="line">RS	输入记录分隔符 </span><br><span class="line">NF	当前记录里域个数 </span><br><span class="line">NR	到目前为止记录数 </span><br><span class="line">OFS	输出域分隔符 </span><br><span class="line">ORS	输出记录分隔符 </span><br></pre></td></tr></table></figure>

<h2 id="调用awk"><a href="#调用awk" class="headerlink" title="调用awk"></a>调用awk</h2><figure class="highlight bash"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br><span class="line">38</span><br><span class="line">39</span><br><span class="line">40</span><br><span class="line">41</span><br><span class="line">42</span><br><span class="line">43</span><br><span class="line">44</span><br><span class="line">45</span><br><span class="line">46</span><br><span class="line">47</span><br><span class="line">48</span><br><span class="line">49</span><br><span class="line">50</span><br><span class="line">51</span><br><span class="line">52</span><br><span class="line">53</span><br><span class="line">54</span><br><span class="line">55</span><br><span class="line">56</span><br><span class="line">57</span><br><span class="line">58</span><br><span class="line">59</span><br><span class="line">60</span><br><span class="line">61</span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br><span class="line">82</span><br><span class="line">83</span><br><span class="line">84</span><br><span class="line">85</span><br><span class="line">86</span><br><span class="line">87</span><br><span class="line">88</span><br><span class="line">89</span><br><span class="line">90</span><br><span class="line">91</span><br><span class="line">92</span><br><span class="line">93</span><br><span class="line">94</span><br><span class="line">95</span><br><span class="line">96</span><br><span class="line">97</span><br><span class="line">98</span><br><span class="line">99</span><br><span class="line">100</span><br><span class="line">101</span><br><span class="line">102</span><br><span class="line">103</span><br><span class="line">104</span><br><span class="line">105</span><br><span class="line">106</span><br><span class="line">107</span><br><span class="line">108</span><br><span class="line">109</span><br><span class="line">110</span><br><span class="line">111</span><br><span class="line">112</span><br><span class="line">113</span><br><span class="line">114</span><br><span class="line">115</span><br><span class="line">116</span><br><span class="line">117</span><br><span class="line">118</span><br><span class="line">119</span><br><span class="line">120</span><br><span class="line">121</span><br><span class="line">122</span><br><span class="line">123</span><br><span class="line">124</span><br><span class="line">125</span><br><span class="line">126</span><br><span class="line">127</span><br><span class="line">128</span><br><span class="line">129</span><br><span class="line">130</span><br><span class="line">131</span><br><span class="line">132</span><br><span class="line">133</span><br><span class="line">134</span><br><span class="line">135</span><br><span class="line">136</span><br><span class="line">137</span><br><span class="line">138</span><br><span class="line">139</span><br><span class="line">140</span><br><span class="line">141</span><br><span class="line">142</span><br><span class="line">143</span><br><span class="line">144</span><br><span class="line">145</span><br><span class="line">146</span><br><span class="line">147</span><br><span class="line">148</span><br><span class="line">149</span><br><span class="line">150</span><br><span class="line">151</span><br><span class="line">152</span><br><span class="line">153</span><br><span class="line">154</span><br><span class="line">155</span><br><span class="line">156</span><br><span class="line">157</span><br><span class="line">158</span><br><span class="line">159</span><br><span class="line">160</span><br><span class="line">161</span><br><span class="line">162</span><br></pre></td><td class="code"><pre><span class="line"></span><br><span class="line">1、awk <span class="string">&#x27;/101/&#x27;</span>               file 显示文件file中包含101的匹配行。 </span><br><span class="line">   awk <span class="string">&#x27;/101/,/105/&#x27;</span>         file </span><br><span class="line">   awk <span class="string">&#x27;$1 == 5&#x27;</span>             file </span><br><span class="line">   awk <span class="string">&#x27;$1 == &quot;CT&quot;&#x27;</span>          file 注意必须带双引号 </span><br><span class="line">   awk <span class="string">&#x27;$1 * $2 &gt;100 &#x27;</span>       file  </span><br><span class="line">   awk <span class="string">&#x27;$2 &gt;5 &amp;&amp; $2&lt;=15&#x27;</span>     file</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">2、awk <span class="string">&#x27;&#123;print NR,NF,$1,$NF,&#125;&#x27;</span> file 显示文件file的当前记录号、域数和每一行的第一个和最后一个域。 </span><br><span class="line">   awk <span class="string">&#x27;/101/ &#123;print $1,$2 + 10&#125;&#x27;</span> file 显示文件file的匹配行的第一、二个域加10。 </span><br><span class="line">   awk <span class="string">&#x27;/101/ &#123;print $1$2&#125;&#x27;</span>  file </span><br><span class="line">   awk <span class="string">&#x27;/101/ &#123;print $1 $2&#125;&#x27;</span> file 显示文件file的匹配行的第一、二个域，但显示时域中间没有分隔符。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">3、<span class="built_in">df</span> | awk <span class="string">&#x27;$4&gt;1000000 &#x27;</span>         通过管道符获得输入，如：显示第4个域满足条件的行。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">4、awk -F <span class="string">&quot;|&quot;</span> <span class="string">&#x27;&#123;print $1&#125;&#x27;</span>   file 按照新的分隔符“|”进行操作。 </span><br><span class="line">   awk  <span class="string">&#x27;BEGIN &#123; FS=&quot;[: \t|]&quot; &#125; </span></span><br><span class="line"><span class="string">   &#123;print $1,$2,$3&#125;&#x27;</span> 	     file 通过设置输入分隔符（FS=<span class="string">&quot;[: \t|]&quot;</span>）修改输入分隔符。 </span><br><span class="line"></span><br><span class="line">   Sep=<span class="string">&quot;|&quot;</span> </span><br><span class="line">   awk -F <span class="variable">$Sep</span> <span class="string">&#x27;&#123;print $1&#125;&#x27;</span>  file 按照环境变量Sep的值做为分隔符。    </span><br><span class="line">   awk -F <span class="string">&#x27;[ :\t|]&#x27;</span> <span class="string">&#x27;&#123;print $1&#125;&#x27;</span> file 按照正则表达式的值做为分隔符，这里代表空格、:、TAB、|同时做为分隔符。 </span><br><span class="line">   awk -F <span class="string">&#x27;[][]&#x27;</span>    <span class="string">&#x27;&#123;print $1&#125;&#x27;</span> file 按照正则表达式的值做为分隔符，这里代表[、]</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">5、awk -f awkfile 	     file 通过文件awkfile的内容依次进行控制。 </span><br><span class="line">   <span class="built_in">cat</span> awkfile </span><br><span class="line">/101/&#123;<span class="built_in">print</span> <span class="string">&quot;\047 Hello! \047&quot;</span>&#125; --遇到匹配行以后打印 <span class="string">&#x27; Hello! &#x27;</span>.\047代表单引号。 </span><br><span class="line">&#123;<span class="built_in">print</span> <span class="variable">$1</span>,<span class="variable">$2</span>&#125;                   --因为没有模式控制，打印每一行的前两个域。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">6、awk <span class="string">&#x27;$1 ~ /101/ &#123;print $1&#125;&#x27;</span> file 显示文件中第一个域匹配101的行（记录）。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">7、awk   <span class="string">&#x27;BEGIN &#123; OFS=&quot;%&quot;&#125; </span></span><br><span class="line"><span class="string">   &#123;print $1,$2&#125;&#x27;</span>           file 通过设置输出分隔符（OFS=<span class="string">&quot;%&quot;</span>）修改输出格式。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">8、awk   <span class="string">&#x27;BEGIN &#123; max=100 ;print &quot;max=&quot; max&#125;             BEGIN 表示在处理任意行之前进行的操作。 </span></span><br><span class="line"><span class="string">   &#123;max=($1 &gt;max ?$1:max); print $1,&quot;Now max is &quot;max&#125;&#x27;</span> file 取得文件第一个域的最大值。 </span><br><span class="line">   （表达式1?表达式2:表达式3 相当于： </span><br><span class="line">   <span class="keyword">if</span> (表达式1) </span><br><span class="line">       表达式2 </span><br><span class="line">   <span class="keyword">else</span> </span><br><span class="line">       表达式3 </span><br><span class="line">   awk <span class="string">&#x27;&#123;print ($1&gt;4 ? &quot;high &quot;$1: &quot;low &quot;$1)&#125;&#x27;</span> file </span><br><span class="line"></span><br><span class="line"></span><br><span class="line">9、awk <span class="string">&#x27;$1 * $2 &gt;100 &#123;print $1&#125;&#x27;</span> file 显示文件中第一个域匹配101的行（记录）。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">10、awk <span class="string">&#x27;&#123;$1 == &#x27;</span>Chi<span class="string">&#x27; &#123;$3 = &#x27;</span>China<span class="string">&#x27;; print&#125;&#x27;</span> file 找到匹配行后先将第3个域替换后再显示该行（记录）。 </span><br><span class="line">    awk <span class="string">&#x27;&#123;$7 %= 3; print $7&#125;&#x27;</span>  file 将第7域被3除，并将余数赋给第7域再打印。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">11、awk <span class="string">&#x27;/tom/ &#123;wage=$2+$3; printf wage&#125;&#x27;</span> file 找到匹配行后为变量wage赋值并打印该变量。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">12、awk <span class="string">&#x27;/tom/ &#123;count++;&#125;  </span></span><br><span class="line"><span class="string">         END &#123;print &quot;tom was found &quot;count&quot; times&quot;&#125;&#x27;</span> file END表示在所有输入行处理完后进行处理。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">13、awk <span class="string">&#x27;gsub(/\$/,&quot;&quot;);gsub(/,/,&quot;&quot;); cost+=$4; </span></span><br><span class="line"><span class="string">         END &#123;print &quot;The total is $&quot; cost&gt;&quot;filename&quot;&#125;&#x27;</span>    file gsub函数用空串替换$和,再将结果输出到filename中。 </span><br><span class="line">    1 2 3 <span class="variable">$1</span>,200.00 </span><br><span class="line">    1 2 3 <span class="variable">$2</span>,300.00 </span><br><span class="line">    1 2 3 <span class="variable">$4</span>,000.00 </span><br><span class="line"></span><br><span class="line">    awk <span class="string">&#x27;&#123;gsub(/\$/,&quot;&quot;);gsub(/,/,&quot;&quot;); </span></span><br><span class="line"><span class="string">    if ($4&gt;1000&amp;&amp;$4&lt;2000) c1+=$4; </span></span><br><span class="line"><span class="string">    else if ($4&gt;2000&amp;&amp;$4&lt;3000) c2+=$4; </span></span><br><span class="line"><span class="string">    else if ($4&gt;3000&amp;&amp;$4&lt;4000) c3+=$4; </span></span><br><span class="line"><span class="string">    else c4+=$4; &#125; </span></span><br><span class="line"><span class="string">    END &#123;printf  &quot;c1=[%d];c2=[%d];c3=[%d];c4=[%d]\n&quot;,c1,c2,c3,c4&#125;&quot;&#x27;</span> file </span><br><span class="line">    通过<span class="keyword">if</span>和<span class="keyword">else</span> <span class="keyword">if</span>完成条件语句 </span><br><span class="line"></span><br><span class="line">    awk <span class="string">&#x27;&#123;gsub(/\$/,&quot;&quot;);gsub(/,/,&quot;&quot;); </span></span><br><span class="line"><span class="string">    if ($4&gt;3000&amp;&amp;$4&lt;4000) exit; </span></span><br><span class="line"><span class="string">    else c4+=$4; &#125; </span></span><br><span class="line"><span class="string">    END &#123;printf  &quot;c1=[%d];c2=[%d];c3=[%d];c4=[%d]\n&quot;,c1,c2,c3,c4&#125;&quot;&#x27;</span> file </span><br><span class="line">    通过<span class="built_in">exit</span>在某条件时退出，但是仍执行END操作。 </span><br><span class="line">    awk <span class="string">&#x27;&#123;gsub(/\$/,&quot;&quot;);gsub(/,/,&quot;&quot;); </span></span><br><span class="line"><span class="string">    if ($4&gt;3000) next; </span></span><br><span class="line"><span class="string">    else c4+=$4; &#125; </span></span><br><span class="line"><span class="string">    END &#123;printf  &quot;c4=[%d]\n&quot;,c4&#125;&quot;&#x27;</span> file </span><br><span class="line">    通过next在某条件时跳过该行，对下一行执行操作。 </span><br><span class="line"></span><br><span class="line"></span><br><span class="line">14、awk <span class="string">&#x27;&#123; print FILENAME,$0 &#125;&#x27;</span> file1 file2 file3&gt;fileall 把file1、file2、file3的文件内容全部写到fileall中，格式为 </span><br><span class="line">    打印文件并前置文件名。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">15、awk <span class="string">&#x27; $1!=previous &#123; close(previous); previous=$1 &#125;    </span></span><br><span class="line"><span class="string">    &#123;print substr($0,index($0,&quot; &quot;) +1)&gt;$1&#125;&#x27;</span> fileall 把合并后的文件重新分拆为3个文件。并与原文件一致。</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">16、awk <span class="string">&#x27;BEGIN &#123;&quot;date&quot;|getline d; print d&#125;&#x27;</span>         通过管道把<span class="built_in">date</span>的执行结果送给getline，并赋给变量d，然后打印。 </span><br><span class="line"></span><br><span class="line"></span><br><span class="line">17、awk <span class="string">&#x27;BEGIN &#123;system(&quot;echo \&quot;Input your name:\\c\&quot;&quot;); getline d;print &quot;\nYour name is&quot;,d,&quot;\b!\n&quot;&#125;&#x27;</span> </span><br><span class="line">    通过getline命令交互输入name，并显示出来。 </span><br><span class="line">    awk <span class="string">&#x27;BEGIN &#123;FS=&quot;:&quot;; while(getline&lt; &quot;/etc/passwd&quot; &gt;0) &#123; if($1~&quot;050[0-9]_&quot;) print $1&#125;&#125;&#x27;</span> </span><br><span class="line">    打印/etc/passwd文件中用户名包含050x_的用户名。 </span><br><span class="line"></span><br><span class="line">18、awk <span class="string">&#x27;&#123; i=1;while(i&lt;NF) &#123;print NF,$i;i++&#125;&#125;&#x27;</span> file 通过<span class="keyword">while</span>语句实现循环。 </span><br><span class="line">    awk <span class="string">&#x27;&#123; for(i=1;i&lt;NF;i++) &#123;print NF,$i&#125;&#125;&#x27;</span>   file 通过<span class="keyword">for</span>语句实现循环。     </span><br><span class="line">    <span class="built_in">type</span> file|awk -F <span class="string">&quot;/&quot;</span> <span class="string">&#x27; </span></span><br><span class="line"><span class="string">    &#123; for(i=1;i&lt;NF;i++) </span></span><br><span class="line"><span class="string">    &#123; if(i==NF-1) &#123; printf &quot;%s&quot;,$i &#125; </span></span><br><span class="line"><span class="string">    else &#123; printf &quot;%s/&quot;,$i &#125; &#125;&#125;&#x27;</span>               显示一个文件的全路径。 </span><br><span class="line">    用<span class="keyword">for</span>和<span class="keyword">if</span>显示日期 </span><br><span class="line">    awk  <span class="string">&#x27;BEGIN &#123; </span></span><br><span class="line"><span class="string">for(j=1;j&lt;=12;j++) </span></span><br><span class="line"><span class="string">&#123; flag=0; </span></span><br><span class="line"><span class="string">  printf &quot;\n%d月份\n&quot;,j; </span></span><br><span class="line"><span class="string">        for(i=1;i&lt;=31;i++) </span></span><br><span class="line"><span class="string">        &#123; </span></span><br><span class="line"><span class="string">        if (j==2&amp;&amp;i&gt;28) flag=1; </span></span><br><span class="line"><span class="string">        if ((j==4||j==6||j==9||j==11)&amp;&amp;i&gt;30) flag=1; </span></span><br><span class="line"><span class="string">        if (flag==0) &#123;printf &quot;%02d%02d &quot;,j,i&#125; </span></span><br><span class="line"><span class="string">        &#125; </span></span><br><span class="line"><span class="string">&#125; </span></span><br><span class="line"><span class="string">&#125;&#x27;</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line">19、在awk中调用系统变量必须用单引号，如果是双引号，则表示字符串 </span><br><span class="line">Flag=abcd </span><br><span class="line">awk <span class="string">&#x27;&#123;print &#x27;</span><span class="variable">$Flag</span><span class="string">&#x27;&#125;&#x27;</span>   结果为abcd </span><br><span class="line">awk <span class="string">&#x27;&#123;print  &quot;$Flag&quot;&#125;&#x27;</span>   结果为<span class="variable">$Flag</span></span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="comment"># 对a.txt文件的第四个域进行求和！</span></span><br><span class="line">awk <span class="string">&#x27;BEGIN&#123;total=0&#125;&#123;total+=$4&#125;END&#123;print total&#125;&#x27;</span> a.txt</span><br><span class="line"></span><br><span class="line"><span class="comment"># 打印所有以模式no或so开头的行。</span></span><br><span class="line">awk <span class="string">&#x27;/^(no|so)/&#x27;</span> <span class="built_in">test</span>  </span><br><span class="line"></span><br><span class="line"><span class="comment"># 如果记录以n或s开头，就打印这个记录。</span></span><br><span class="line">awk <span class="string">&#x27;/^[ns]/&#123;print $1&#125;&#x27;</span> <span class="built_in">test</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 如果第一个域以两个数字结束就打印这个记录。</span></span><br><span class="line">awk <span class="string">&#x27;$1 ~/[0-9][0-9]$/(print $1&#125;&#x27;</span> <span class="built_in">test</span> </span><br><span class="line"></span><br><span class="line"><span class="comment"># 如果第一个或等于100或者第二个域小于50，则打印该行。</span></span><br><span class="line">awk <span class="string">&#x27;$1 == 100 || $2 &lt; 50&#x27;</span> <span class="built_in">test</span></span><br><span class="line"></span><br><span class="line"><span class="comment"># 如果第一个域不等于10就打印该行。</span></span><br><span class="line">awk <span class="string">&#x27;$1 != 10&#x27;</span> <span class="built_in">test</span></span><br><span class="line"></span><br><span class="line"><span class="comment">#如果记录包含正则表达式test，则第一个域加10并打印出来。</span></span><br><span class="line">awk <span class="string">&#x27;/test/&#123;print $1 + 10&#125;&#x27;</span> <span class="built_in">test</span> </span><br><span class="line"></span><br><span class="line"><span class="comment">#如果第一个域大于5则打印问号后面的表达式值，否则打印冒号后面的表达式值。</span></span><br><span class="line">awk <span class="string">&#x27;&#123;print ($1 &gt; 5 ? &quot;ok &quot;$1: &quot;error&quot;$1)&#125;&#x27;</span> <span class="built_in">test</span> </span><br><span class="line"></span><br><span class="line"></span><br><span class="line"><span class="comment">#打印以正则表达式root开头的记录到以正则表达式mysql开头的记录范围内的所有记录。如果找到一个新的正则表达式root开头的记 录，则继续打印直到下一个以正则表达式mysql开头的记录为止，或到文件末尾。</span></span><br><span class="line">awk <span class="string">&#x27;/^root/,/^mysql/&#x27;</span> <span class="built_in">test</span> </span><br><span class="line"></span><br></pre></td></tr></table></figure>


<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br></pre></td><td class="code"><pre><span class="line"># 一个示例</span><br><span class="line">set -e</span><br><span class="line">login=&quot;-h192.168.1.70 -P3306 -uroot -proot&quot;</span><br><span class="line">#读数据</span><br><span class="line">databases=$(mysql $&#123;login&#125; -N -e &quot;show databases like &#x27;pre_%&#x27;;&quot;)</span><br><span class="line">if [ -e datasAll.txt ]; then</span><br><span class="line">    cat /dev/null &gt;datasAll.txt</span><br><span class="line">fi</span><br><span class="line">for i in $&#123;databases&#125;</span><br><span class="line">do</span><br><span class="line">    echo $&#123;i&#125; &gt;&gt;log.txt</span><br><span class="line">    tables=$(mysql $&#123;login&#125; -N -e &quot;use $&#123;i&#125;; show tables;&quot;)</span><br><span class="line">    for j in $&#123;tables&#125;</span><br><span class="line">    do</span><br><span class="line">        mysql $&#123;login&#125; -N --default-character-set=utf8 -e &quot;use $&#123;i&#125;; select uid, income, spend, create_at from $&#123;j&#125;&quot; &gt;&gt;datasAll.txt</span><br><span class="line">    done</span><br><span class="line">done</span><br><span class="line">#统计数据</span><br><span class="line">echo &#x27;--&gt;step 1&#x27; &gt;&gt;log.txt</span><br><span class="line">grep &quot;2014-&quot; datasAll.txt &gt;datas2014.txt</span><br><span class="line">echo &#x27;--&gt;step 2&#x27; &gt;&gt;log.txt</span><br><span class="line">awk &#x27;BEGIN&#123;FS=&quot;\t&quot;;OFS=&quot;\t&quot;;&#125;&#123;income[$1]+=$2;outlays[$1]+=$3;&#125;END&#123;for(key in income)&#123;print key,income[key],outlays[key] &gt;&quot;sumAll.txt&quot;&#125;&#125;&#x27; datasAll.txt</span><br><span class="line">echo &#x27;--&gt;step 3&#x27; &gt;&gt;log.txt</span><br><span class="line">awk &#x27;BEGIN&#123;FS=&quot;\t&quot;;OFS=&quot;\t&quot;;&#125;&#123;income[$1]+=$2;outlays[$1]+=$3;&#125;END&#123;for(key in income)&#123;print key,income[key],outlays[key] &gt;&quot;sum2014.txt&quot;&#125;&#125;&#x27; datas2014.txt</span><br><span class="line">echo &#x27;--&gt;step 4&#x27; &gt;&gt;log.txt</span><br><span class="line">awk &#x27;BEGIN&#123;FS=&quot;\t&quot;;OFS=&quot;\t&quot;;&#125;&#123;if(NR==FNR)&#123;uid[$1]=$2&#125;else if(NR&gt;FNR)&#123;if($1 in uid)&#123;margin=uid[$1]+$3;if(margin&gt;0)&#123;print $1,$2+$3-margin,margin &gt;&quot;baseDatas.txt&quot;&#125;&#125;&#125;&#125;&#x27; sum2014.txt sumAll.txt</span><br><span class="line"></span><br><span class="line">#清理数据</span><br><span class="line">echo &#x27;--&gt;step 6&#x27; &gt;&gt;log.txt</span><br><span class="line">rm -f datasAll.txt sumAll.txt datas2014.txt sum2014.txt log.txt</span><br><span class="line">#baseDatas.txt : 用户ID | 更新后摇豆总结余 | 2014年摇豆总结余 </span><br><span class="line"></span><br><span class="line">echo &#x27;--&gt;OVER&#x27; &gt;&gt;log.txt</span><br><span class="line"></span><br></pre></td></tr></table></figure>
